<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WinBig</title>
    <link rel="stylesheet" href="styles/index.css">
    <script src="https://code.jquery.com/jquery-3.7.1.slim.js" integrity="sha256-UgvvN8vBkgO0luPSUl2s8TIlOSYRoGFAX4jlCIm9Adc=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <script src="JS/index.js"></script>
    <link rel="stylesheet" href="styles/nav.css">
</head>
<body class="m-0 p-0">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <h1 id="logo">WinBig</h1>
            </a>
            <ul class="navbar-nav p-0">
                <li class="nav-item"><a class="nav-link" href="">Setting</a></li>
            </ul>
        </div>
    </nav>

    <div class="row mt-4 rounded w-100">
        <div class="col-12">
            <h1 class="m-3">Gallery</h1>
        </div>
        <div class="scrollmenu col">
            <div class="card">
                <img class="card-img-top" src="images/placeholder.jpg" alt="Miniature de la vidéo">
                <h2 class="card-title">Titre</h2>
                <p class="card-text text-wrap" >description, description, description, description, description, description, description, description, description, description</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="signupModal" data-keyboard="false" data-backdrop="static">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content" id="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title text-white" id="signupModalLabel">Signup</h3>
                </div>
                <div class="modal-body">
                    <form id="signupForm">
                        <div class="form-group">
                            <label for="email" class="text-white">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" pattern="[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$" required>
                        </div>
                        <div class="form-group">
                            <label class="text-white" for="password">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                        </div>
                        <div class="form-group">
                            <label class="text-white" for="cc" >Credit Card Number</label>
                            <input type="text" class="form-control" id="cc" placeholder="1111 2222 3333 4444" pattern="[\d]{16}" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label class="text-white" for="ed">Expiration Date</label>
                                <input type="text" class="form-control" id="ed" placeholder="mm/yy" pattern="^(0[1-9]|1[0-2])\/\d{2}$" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label class="text-white" for="cvv">CVV</label>
                                <input type="text" class="form-control" id="cvv" placeholder="123" pattern="^[\d]{3,4}$" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <input type="reset" class="btn btn-secondary">
                            <input type="submit" class="btn btn-primary">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
