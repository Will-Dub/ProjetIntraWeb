<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="UTF-8">
    <title>WinBig</title>
    <link rel="stylesheet" href="styles/nav.css">

    <script src="https://code.jquery.com/jquery-3.7.1.slim.js" integrity="sha256-UgvvN8vBkgO0luPSUl2s8TIlOSYRoGFAX4jlCIm9Adc=" crossorigin="anonymous"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
            integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>

    <script src="JS/blackjack.js"></script>
    <script src="JS/nav.js"></script>
    <link rel="stylesheet" href="styles/blackjack.css">
</head>
<body class="m-0 p-0">
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <h1 id="logo">WinBig</h1>
        </a>
        <ul class="navbar-nav p-0">
            <li class="nav-item text-white"><h2 id="soldeLabel"></h2></li>
        </ul>
    </div>
</nav>

<div class="row mt-2 w-100">
    <div id="history_container" class="container m-0 col-sm-4">
        <div>
            <button id="show_table_btn" class="btn btn-secondary mb-1">Montrer l'historique</button>
        </div>
        <div id="history_table" class="table-slide-in d-none table-responsive">
            <table class="table table-bordered text-white table-striped">
                <thead>
                <tr>
                    <th>Numéro</th>
                    <th>Mise</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="tbody_history"></tbody>
            </table>
        </div>

    </div>

    <div id="casino_cards" class="container col-sm-4 d-flex justify-content-center col-sm-4 p-0 m-0">
        <img src="" id="casino-card0" alt="Blackjack Image" class="img-fluid card  d-none">
        <img src="" id="casino-card1" alt="Blackjack Image" class="img-fluid card ml-2 d-none">
        <img src="" id="casino-card2" alt="Blackjack Image" class="img-fluid card ml-2 d-none">
        <img src="" id="casino-card3" alt="Blackjack Image" class="img-fluid card ml-2 d-none">
        <img src="" id="casino-card4" alt="Blackjack Image" class="img-fluid card ml-2 d-none">
        <img src="" id="casino-card5" alt="Blackjack Image" class="img-fluid card ml-2 d-none">
        <img src="" id="casino-card6" alt="Blackjack Image" class="img-fluid card ml-2 d-none">
        <img src="" id="casino-card7" alt="Blackjack Image" class="img-fluid card ml-2 d-none">
        <img src="" id="casino-card8" alt="Blackjack Image" class="img-fluid card ml-2 d-none">
        <img src="" id="casino-card9" alt="Blackjack Image" class="img-fluid card ml-2 d-none">
    </div>
</div>

<div id="user_cards" class="d-flex justify-content-center align-items-center fixed-bottom">
    <img src="" id="user-card0" alt="Blackjack Image" class="card d-none">
    <img src="" id="user-card1" alt="Blackjack Image" class="card ml-1 d-none">
    <img src="" id="user-card2" alt="Blackjack Image" class="card ml-1 d-none">
    <img src="" id="user-card3" alt="Blackjack Image" class="card ml-1 d-none">
    <img src="" id="user-card4" alt="Blackjack Image" class="card ml-1 d-none">
    <img src="" id="user-card5" alt="Blackjack Image" class="card ml-1 d-none">
    <img src="" id="user-card6" alt="Blackjack Image" class="card ml-1 d-none">
    <img src="" id="user-card7" alt="Blackjack Image" class="card ml-1 d-none">
    <img src="" id="user-card8" alt="Blackjack Image" class="card ml-1 d-none">
    <img src="" id="user-card9" alt="Blackjack Image" class="card ml-1 d-none">
</div>

<div class="fixed-bottom row mb-3">
    <span class="col-sm-4 display-4 font-weight-bold text-white" id="bet_amount_indicator"></span>
    <div class="col-sm-4 justify-content-center text-center">
        <button onclick="hit();" id="btn-hit" class="btn btn-user d-none">Hit</button>
        <button onclick="stand();" id="btn-stand" class="btn btn-user d-none">Stand</button>
        <button onclick="insurance();" id="btn-insurance" class="btn btn-user d-none">Insurance</button>
        <button onclick="$('#betModal').modal('show');" id="btn-play" class="btn-lg btn-user d-none">Jouer</button>
    </div>
</div>

<div class="modal fade" id="betModal" tabindex="-1" role="dialog" aria-labelledby="winModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content" id="modal-content">
            <div class="modal-header">
                <h3 class="modal-title text-white" id="betModalLabel">Jeux</h3>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="betForm">
                    <div class="form-group form-row">
                        <label class="text-white col-md-4" for="bet_amount">Argent à miser</label>
                        <div class="input-group col-md-6">
                            <input type="number" class="" id="bet_amount" placeholder="0.00" min="0.01" max="1000000" step="0.01" required>
                            <div class="input-group-append">
                                <span class="input-group-text">$</span>
                            </div>
                        </div>
                        <label class="text-danger erreur" id="bet_invalide">Vous n'avez pas assez d'argent</label>
                    </div>

                    <div class="modal-footer">
                        <input type="reset" class="btn btn-secondary">
                        <input type="submit" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="resultModal" tabindex="-1" role="dialog" aria-labelledby="winModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content" id="result-content">
            <div class="modal-header">
                <h3 class="modal-title text-white" id="resultModalLabel"></h3>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
